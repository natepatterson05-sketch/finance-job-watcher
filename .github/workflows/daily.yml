name: Daily job watcher

on:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: finance-job-watcher-daily
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Collect each board and rebuild history
        id: collection
        continue-on-error: true
        run: |
          rm -f data/status.json
          python -m finance_job_watcher.cli collect
      - name: Require a freshly completed collection status
        run: |
          python -c "import json; from pathlib import Path; s=json.loads(Path('data/status.json').read_text()); assert s['sources'], 'Missing source outcomes'"
      - name: Create or update the daily Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m finance_job_watcher.issues --publish
      - name: Commit and push daily data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/raw data/history.csv data/status.json
          if ! git diff --cached --quiet; then
            WATCHER_RUN_DATE=$(python -c "import json; print(json.load(open('data/status.json'))['run_time'][:10])")
            git commit -m "data: daily job market ${WATCHER_RUN_DATE}"
            git push
          fi
