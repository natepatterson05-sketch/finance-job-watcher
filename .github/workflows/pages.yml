name: Publish GitHub Pages

on:
  push:
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily job watcher']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: finance-job-watcher-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name != 'workflow_run' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - name: Validate browser code
        run: |
          node --check assets/app.mjs
          node --check sw.js
          node tests/web/metrics.test.mjs
      - name: Stage website and current data
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
